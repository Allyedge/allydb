syntax = "proto3";

package AllyDB;

import "google/protobuf/struct.proto";

service DatabaseService {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Set(SetRequest) returns (SetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc LPush(LPushRequest) returns (LPushResponse);
    rpc RPush(RPushRequest) returns (RPushResponse);
    rpc LPop(LPopRequest) returns (LPopResponse);
    rpc RPop(RPopRequest) returns (RPopResponse);
    rpc LLen(LLenRequest) returns (LLenResponse);
    rpc LIndex(LIndexRequest) returns (LIndexResponse);
    rpc LRange(LRangeRequest) returns (LRangeResponse);
}

message GetRequest { string key = 1; }

message GetResponse {
    oneof result {
        google.protobuf.Value value = 1;
        bool not_found = 2;
        bool shard_unavailable = 3;
        string shard_crash_reason = 4;
    }
}

message SetRequest {
    string key = 1;
    google.protobuf.Value value = 2;
}

message SetResponse {
    oneof result {
        bool ok = 1;
        bool shard_unavailable = 2;
    }
}

message DeleteRequest { string key = 1; }

message DeleteResponse {
    oneof result {
        bool ok = 1;
        bool shard_unavailable = 2;
    }
}

message LPushRequest {
    string key = 1;
    repeated google.protobuf.Value values = 2;
}

message LPushResponse {
    oneof result {
        int64 new_length = 1;
        bool shard_unavailable = 2;
        string shard_crash_reason = 3;
    }
}

message RPushRequest {
    string key = 1;
    repeated google.protobuf.Value values = 2;
}

message RPushResponse {
    oneof result {
        int64 new_length = 1;
        bool shard_unavailable = 2;
        string shard_crash_reason = 3;
    }
}

message LPopRequest { string key = 1; }

message LPopResponse {
    oneof result {
        google.protobuf.Value value = 1;
        bool empty_list = 2;
        bool not_found = 3;
        bool shard_unavailable = 4;
        string shard_crash_reason = 5;
    }
}

message RPopRequest { string key = 1; }

message RPopResponse {
    oneof result {
        google.protobuf.Value value = 1;
        bool empty_list = 2;
        bool not_found = 3;
        bool shard_unavailable = 4;
        string shard_crash_reason = 5;
    }
}

message LLenRequest { string key = 1; }

message LLenResponse {
    oneof result {
        int64 length = 1;
        bool not_found = 2;
        bool shard_unavailable = 3;
        string shard_crash_reason = 4;
    }
}

message LIndexRequest {
    string key = 1;
    int64 index = 2;
}

message LIndexResponse {
    oneof result {
        google.protobuf.Value value = 1;
        bool index_out_of_range = 2;
        bool not_found = 3;
        bool shard_unavailable = 4;
        string shard_crash_reason = 5;
    }
}

message LRangeRequest {
    string key = 1;
    int64 start = 2;
    int64 stop = 3;
}

message LRangeResponse {
    oneof result {
        ListValues values = 1;
        bool not_found = 2;
        bool shard_unavailable = 3;
        string shard_crash_reason = 4;
    }
}

message ListValues { repeated google.protobuf.Value values = 1; }

service ActorService {
    rpc StartActor(StartActorRequest) returns (StartActorResponse);
    rpc StopActor(StopActorRequest) returns (StopActorResponse);
    rpc CallActor(CallActorRequest) returns (CallActorResponse);
    rpc CastActor(CastActorRequest) returns (CastActorResponse);
}

message StartActorRequest {
    string actor_id = 1;
    string actor_module = 2;
    google.protobuf.Value init_args = 3;
}

message StartActorResponse {
    oneof result {
        bool ok = 1;
        bool already_started = 2;
        string start_failed_reason = 3;
    }
}

message StopActorRequest { string actor_id = 1; }

message StopActorResponse {
    oneof result {
        bool ok = 1;
        bool actor_not_found = 2;
    }
}

message CallActorRequest {
    string actor_id = 1;
    google.protobuf.Value request_payload = 2;
    int64 timeout_ms = 3;
}

message CallActorResponse {
    oneof result {
        google.protobuf.Value reply_payload = 1;
        bool actor_not_found = 2;
        bool call_timeout = 3;
        string actor_crash_reason = 4;
    }
}

message CastActorRequest {
    string actor_id = 1;
    google.protobuf.Value message_payload = 2;
}

message CastActorResponse {
    oneof result {
        bool ok = 1;
        bool actor_not_found = 2;
    }
}
